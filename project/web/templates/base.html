<!DOCTYPE html>
<html>
<head>
    <title>{{ block "title" . }} Movie Review Hub {{ end }}</title>
    <style>
        /* основные стили */
        :root {
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --accent: #d4af37;
            --light-accent: #f8e6c0;
            --text: #f5f5f5;
            --border: #333;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        a {
            color: var(--accent);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: var(--light-accent);
            text-decoration: underline;
        }
        
        /* шапка сайта */
        header {
            background-color: #1a1a1a;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            font-size: 2rem;
        }
        
        nav {
            display: flex;
            gap: 1rem;
        }
        
        nav a {
            padding: 0.5rem 1.2rem;
            background-color: #2c2c2c;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        nav a:hover {
            background-color: #3a3a3a;
            text-decoration: none;
            transform: translateY(-2px);
        }
        
        /* основной контент */
        main {
            flex: 1;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* подвал сайта */
        footer {
            background-color: #1a1a1a;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .copyright {
            color: #888;
            font-size: 0.9rem;
        }
        
        /* общие компоненты */
        .section-title {
            position: relative;
            padding-left: 20px;
            margin-bottom: 2rem;
        }
        
        .section-title::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 80%;
            width: 5px;
            background-color: var(--accent);
            border-radius: 3px;
        }
        
        .btn {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background-color: var(--light-accent);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid #2a2a2a;
        }
        
        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
            border-color: #3a3a3a;
        }
        
        /* адаптивность */
        @media (max-width: 992px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            nav {
                justify-content: center;
            }
        }
        
        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }
            
            .section-title {
                font-size: 1.5rem;
            }
        }
    </style>
    {{ block "styles" . }}{{ end }}
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-icon">🎬</span>
            <span>Movie Review Hub</span>
        </div>
        <nav>
            <a href="/"><span>🏠</span> Home</a>
            <a href="/discover"><span>🔍</span> Discover</a>
        </nav>
    </header>

    <main class="container">
        {{ block "content" . }}{{ end }}
    </main>

    <footer>
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Contact</a>
        </div>
        <div class="copyright">
            &copy; 2024 Movie Review Hub. All rights reserved.
        </div>
    </footer>
    
    {{ block "scripts" . }}{{ end }}
</body>
</html>
